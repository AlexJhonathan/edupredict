name: Frontend

# Se ejecuta en cada pull request o push que cambie la aplicación web
on:
  pull_request:
    branches: [develop, main]
    paths: ["frontend/**"]
  push:
    branches: [develop, main]
    paths: ["frontend/**"]

jobs:
  compilacion:
    name: Compilación de la aplicación web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
