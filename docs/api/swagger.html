<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EduPredict API · Swagger</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.17.14/swagger-ui.css" />
</head>
<body>
  <!-- Visor del documento Swagger (openapi.yaml). Ábrelo con un servidor local:
       cd docs/api  &&  python -m http.server 8080   y entra a http://localhost:8080/swagger.html
       Con la API encendida, la versión interactiva está en http://localhost:8000/docs -->
  <div id="swagger-ui"></div>
  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.17.14/swagger-ui-bundle.js"></script>
  <script>
    window.ui = SwaggerUIBundle({ url: "openapi.yaml", dom_id: "#swagger-ui" });
  </script>
</body>
</html>
